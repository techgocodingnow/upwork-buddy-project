name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    # Skip release commits to avoid double-runs (release.yml handles those).
    if: "${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the image's default (latest stable) Xcode. The previously pinned
          # Xcode 16.4 / Swift 6.0 fails to compile the Vortex dependency
          # ("cannot infer contextual base in reference to member 'plusLighter'").
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Stage Config.plist (CI stub from example)
        run: |
          cp Sources/UpworkBuddy/Resources/Config.example.plist \
             Sources/UpworkBuddy/Resources/Config.plist

      - name: Build (debug, ad-hoc)
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          swift build --product UpworkBuddy

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Coverage summary
        if: always()
        run: |
          PROF=$(find .build -name default.profdata | head -n 1)
          BIN=$(find .build -path '*UpworkBuddyPackageTests.xctest/Contents/MacOS/UpworkBuddyPackageTests' | head -n 1)
          if [ -n "$PROF" ] && [ -n "$BIN" ]; then
            xcrun llvm-cov report "$BIN" \
              -instr-profile="$PROF" \
              -ignore-filename-regex='(Tests|\.build|checkouts)' || true
          else
            echo "::warning::coverage artifacts not found"
          fi
